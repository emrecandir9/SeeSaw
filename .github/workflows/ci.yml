name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<< |>>>>>>> |=======$)' -- . ':!*.pdf'; then
            echo "::error::Merge conflict markers found"; exit 1
          fi

      - name: No files over 50 MB
        run: |
          big=$(git ls-files -z | xargs -0 -r du -k | awk '$1 > 51200 {print $2}')
          if [ -n "$big" ]; then
            echo "::error::Files over 50 MB (use Git LFS or keep them out of the repo):"; echo "$big"; exit 1
          fi

      - name: No caches or secrets committed
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.godot/|(^|/)\.env$|(^|/)\.env\.|\.pem$|\.key$|\.keystore$' || true)
          if [ -n "$bad" ]; then
            echo "::error::These files must not be committed:"; echo "$bad"; exit 1
          fi

  sidecar-tests:
    name: Sidecar tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for sidecar tests
        id: detect
        run: |
          if [ -f sidecar/requirements.txt ] && [ -d sidecar/tests ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No sidecar/requirements.txt or sidecar/tests yet; skipping."
          fi

      - uses: actions/setup-python@v5
        if: steps.detect.outputs.present == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: sidecar/requirements.txt

      - name: Run tests
        if: steps.detect.outputs.present == 'true'
        working-directory: sidecar
        run: |
          pip install -r requirements.txt pytest
          pytest -q

  godot-import:
    name: Godot checks
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2-stable
    steps:
      - uses: actions/checkout@v4

      - name: Check for Godot project
        id: detect
        run: |
          if [ -f godot/project.godot ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No godot/project.godot yet; skipping."
          fi

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.detect.outputs.present == 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}"
          zip="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl -fsSLO "$base/$zip"
          curl -fsSLO "$base/SHA512-SUMS.txt"
          grep " $zip\$" SHA512-SUMS.txt | sha512sum -c -
          unzip -q "$zip"
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          godot --version

      - name: Import project
        if: steps.detect.outputs.present == 'true'
        run: |
          godot --headless --path godot --import 2>&1 | tee import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load" import.log; then
            echo "::error::Godot reported errors during import"; exit 1
          fi

      - name: Parse every GDScript file
        if: steps.detect.outputs.present == 'true'
        run: |
          status=0
          while IFS= read -r -d '' f; do
            if ! out=$(godot --headless --path godot --check-only --script "res://${f#godot/}" 2>&1) \
               || grep -qE "SCRIPT ERROR|Parse Error" <<<"$out"; then
              echo "::error file=$f::GDScript parse failed"; echo "$out"; status=1
            fi
          done < <(git ls-files -z 'godot/*.gd')
          exit $status

  # Branch rules require only this job. Add every new job to `needs`.
  ci-passed:
    name: CI passed
    if: always()
    needs: [repo-checks, sidecar-tests, godot-import]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "true" ]; then
            echo "::error::A required job did not succeed"; exit 1
          fi
